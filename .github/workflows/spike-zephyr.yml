# Temporary: P1-1 measurement of x3G Zephyr builds on a hosted runner. Manual only;
# no mail, no result history. Remove once the zephyr-west adapter (P1-2) replaces it.
name: Spike Zephyr build

on:
  workflow_dispatch:
    inputs:
      manifest_ref:
        description: Branch, tag or SHA of realmcu/HMI-MANIFEST
        required: false
        default: master

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: rtl8773g-chargebox
            manifest: chargebox/rtl8773g-chargebox-github.yml
            # app dir (relative to zephyrproject/realtek-app) | board | extra cmake args
            builds: |
              applications/chargebox|rtl87x3g_evb|
              samples/honeygui|rtl87x3g_sample|-DENABLE_GENERATE_VERSION=OFF
              samples/lvgl|rtl87x3g_sample|-DENABLE_GENERATE_VERSION=OFF
          - id: rtl8773g-dashboard
            manifest: dashboard/rtl8773g-dashboard-github.yml
            builds: |
              applications/dashboard|rtl87x3g_evb|
              samples/honeygui|rtl87x3g_sample|-DENABLE_GENERATE_VERSION=OFF
    env:
      WS: ${{ github.workspace }}/ws
      REPORT_DIR: ${{ github.workspace }}/report
      SDK_VERSION: 0.16.9
      SDK_DIR: ${{ github.workspace }}/zephyr-sdk-0.16.9
    steps:
      - name: Record baseline disk
        run: |
          mkdir -p "${REPORT_DIR}"
          df -B1 --output=used "${GITHUB_WORKSPACE}" | tail -1 > "${REPORT_DIR}/disk-start.txt"
          df -h "${GITHUB_WORKSPACE}"

      - name: Checkout CI repository
        uses: actions/checkout@v7
        with:
          path: ci

      - name: Checkout manifest repository
        uses: actions/checkout@v7
        with:
          repository: realmcu/HMI-MANIFEST
          ref: ${{ inputs.manifest_ref || 'master' }}
          path: ws/.manifest

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ci/requirements.txt west==1.2.0 \
            cmake ninja pyelftools PyYAML pykwalify packaging anytree intelhex

      - name: Install Zephyr SDK (minimal + arm-zephyr-eabi)
        run: |
          start=$(date +%s)
          base="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}"
          cd "${GITHUB_WORKSPACE}"
          curl -fsSL --retry 3 -O "${base}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          curl -fsSL --retry 3 -O "${base}/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz"
          sha256sum -c <<'EOF'
          b433f19b334cd15f4d7696a958dda214a7737cf41432900d076adce4253782a5  zephyr-sdk-0.16.9_linux-x86_64_minimal.tar.xz
          81162a8326e3cb82fcc53f20528aa7abec29a0bf8376fa009e0c887ba864aaf8  toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz
          EOF
          tar -xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar -xf toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz -C "${SDK_DIR}"
          rm -f ./*.tar.xz
          "${SDK_DIR}/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" --version | head -1 | tee "${REPORT_DIR}/gcc-version.txt"
          echo "sdk_install_s=$(( $(date +%s) - start ))" >> "${REPORT_DIR}/timing.txt"
          du -sb "${SDK_DIR}" | cut -f1 > "${REPORT_DIR}/sdk-bytes.txt"

      - name: Fetch workspace
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          start=$(date +%s)
          python ci/scripts/fetch.py --workspace "${WS}" --manifest "${MANIFEST}" --report-dir "${REPORT_DIR}/fetch"
          echo "west_update_s=$(( $(date +%s) - start ))" >> "${REPORT_DIR}/timing.txt"
          (cd "${WS}" && west manifest --freeze > "${REPORT_DIR}/manifest-revisions.yml")
          du -sb "${WS}" | cut -f1 > "${REPORT_DIR}/ws-bytes-after-update.txt"

      - name: Fetch SDK assets
        run: |
          start=$(date +%s)
          python "${WS}/zephyrproject/realtek-app/fetch_assets.py"
          echo "fetch_assets_s=$(( $(date +%s) - start ))" >> "${REPORT_DIR}/timing.txt"
          du -sb "${WS}/zephyrproject/realtek-app/bin" "${WS}/zephyrproject/realtek-app/tools" > "${REPORT_DIR}/assets-bytes.txt"
          sha256sum "${WS}/zephyrproject/realtek-app/assets.yaml" | cut -d' ' -f1 > "${REPORT_DIR}/assets-yaml-sha256.txt"

      # Checks whether the zsdk version-generation defect (D11) still reproduces,
      # without touching any tracked VERSION file.
      - name: Probe version generation defect
        continue-on-error: true
        working-directory: ws/zephyrproject/realtek-app/samples/honeygui
        run: |
          out="$(mktemp -d)/VERSION"
          bash ../../tools/Gadgets/version_gen_config.sh "${out}" > "${REPORT_DIR}/version-probe.log" 2>&1 || true
          cat "${REPORT_DIR}/version-probe.log"
          if [ -s "${out}" ] && grep -q '^VERSION_MAJOR = [0-9]' "${out}"; then
            echo "version_defect=absent" | tee -a "${REPORT_DIR}/timing.txt"
          else
            echo "version_defect=present" | tee -a "${REPORT_DIR}/timing.txt"
          fi
          git -C ../.. status --short -- samples

      - name: Build
        env:
          BUILDS: ${{ matrix.builds }}
        run: |
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          export ZEPHYR_SDK_INSTALL_DIR="${SDK_DIR}"
          app_root="${WS}/zephyrproject/realtek-app"
          : > "${REPORT_DIR}/builds.tsv"
          failed=0
          while IFS='|' read -r app board extra; do
            [ -z "${app}" ] && continue
            name="${app//\//_}"
            echo "::group::${app} (${board})"
            start=$(date +%s)
            # post_build.cmake resolves mp.ini, VERSION and bin/ from ${CMAKE_BINARY_DIR}/..,
            # so the build directory must be <app>/build.
            set +e
            (cd "${app_root}/${app}" && west build -b "${board}" -p always -d build ${extra:+-- ${extra}}) \
              > "${REPORT_DIR}/build-${name}.log" 2>&1
            code=$?
            set -e
            secs=$(( $(date +%s) - start ))
            tail -40 "${REPORT_DIR}/build-${name}.log"
            echo "::endgroup::"
            bin_dir="${app_root}/${app}/bin"
            if [ "${code}" -eq 0 ] && [ -s "${bin_dir}/app_MP.bin" ]; then result=PASS; else result=FAIL; failed=1; fi
            [ -d "${bin_dir}" ] && ls -l "${bin_dir}" > "${REPORT_DIR}/bin-${name}.txt"
            build_bytes=$(du -sb "${app_root}/${app}/build" 2>/dev/null | cut -f1)
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "${app}" "${board}" "${extra}" "${result}" "${secs}" "${build_bytes}" \
              | tee -a "${REPORT_DIR}/builds.tsv"
          done <<< "${BUILDS}"
          echo "failed=${failed}" >> "${REPORT_DIR}/timing.txt"

      - name: Summarize
        if: always()
        run: |
          df -B1 --output=used "${GITHUB_WORKSPACE}" | tail -1 > "${REPORT_DIR}/disk-end.txt"
          du -sb "${WS}" | cut -f1 > "${REPORT_DIR}/ws-bytes-end.txt"
          du -sb "${WS}"/zephyrproject/* "${WS}"/zephyrproject/modules/* 2>/dev/null | sort -rn > "${REPORT_DIR}/ws-breakdown.txt" || true
          {
            echo "## ${{ matrix.id }}"
            echo
            echo '```'
            cat "${REPORT_DIR}/gcc-version.txt" 2>/dev/null
            cat "${REPORT_DIR}/timing.txt" 2>/dev/null
            echo "sdk_bytes=$(cat "${REPORT_DIR}/sdk-bytes.txt" 2>/dev/null)"
            echo "ws_after_update_bytes=$(cat "${REPORT_DIR}/ws-bytes-after-update.txt" 2>/dev/null)"
            echo "ws_end_bytes=$(cat "${REPORT_DIR}/ws-bytes-end.txt" 2>/dev/null)"
            echo "disk_used_delta_bytes=$(( $(cat "${REPORT_DIR}/disk-end.txt") - $(cat "${REPORT_DIR}/disk-start.txt") ))"
            echo "--- assets"
            cat "${REPORT_DIR}/assets-bytes.txt" 2>/dev/null
            echo "--- builds (app, board, extra, result, seconds, build dir bytes)"
            cat "${REPORT_DIR}/builds.tsv" 2>/dev/null
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if grep -q '^failed=1' "${REPORT_DIR}/timing.txt" 2>/dev/null; then exit 1; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-${{ matrix.id }}-${{ github.run_id }}
          path: report/
          retention-days: 14
