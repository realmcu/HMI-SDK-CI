name: HMI SDK CI

on:
  schedule:
    # Off the top of the hour: GitHub delays schedules at peak times by hours.
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      manifest_ref:
        description: Branch, tag or SHA of realmcu/HMI-MANIFEST to verify
        required: false
        default: master
      targets:
        description: Comma-separated target ids (empty runs every enabled target)
        required: false
        default: ""
      notify_to:
        description: Send this run's mail only to these addresses (empty uses targets.yml)
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hmi-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      manifest_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v7

      - name: Checkout manifest repository
        uses: actions/checkout@v7
        with:
          repository: realmcu/HMI-MANIFEST
          ref: ${{ inputs.manifest_ref || 'master' }}
          path: manifest

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        # Limit collection to tests/ so nothing inside the manifest checkout is picked up.
        run: python -m pytest -q tests

      - name: Validate targets.yml
        run: python scripts/plan.py --validate

      - name: Record manifest commit
        id: commit
        # Every build job checks out this exact commit, even if master moves mid-run.
        run: |
          commit="$(git -C manifest rev-parse HEAD)"
          echo "manifest commit: ${commit}"
          echo "sha=${commit}" >> "${GITHUB_OUTPUT}"
          {
            echo "- CI commit: \`${GITHUB_SHA}\`"
            echo "- Manifest: \`realmcu/HMI-MANIFEST@${commit}\`"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
          ONLY: ${{ inputs.targets }}
        run: |
          python scripts/plan.py \
            --manifest-root manifest \
            --event "${EVENT}" \
            ${ONLY:+--only "${ONLY}"} \
            --output plan.json \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ github.run_id }}
          path: plan.json
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: plan
    # Pull requests only exercise the plan; builds take minutes and pull requests
    # from forks must not reach the build environment.
    if: needs.plan.outputs.jobs != '0' && github.event_name != 'pull_request'
    name: ${{ matrix.id }} (${{ matrix.track }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 60 }}
    strategy:
      # One target or track breaking must not hide the others' results.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WS: ${{ github.workspace }}/ws
      REPORT_DIR: ${{ github.workspace }}/report
      TOOLCHAIN_CACHE: ${{ github.workspace }}/toolchains
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v7
        with:
          path: ci

      - name: Checkout manifest repository
        uses: actions/checkout@v7
        with:
          repository: realmcu/HMI-MANIFEST
          ref: ${{ needs.plan.outputs.manifest_commit }}
          path: ws/.manifest

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt west==1.2.0

      - name: Toolchain cache key
        id: toolchain-key
        env:
          TOOLCHAIN: ${{ toJSON(matrix.toolchain) }}
        run: |
          echo "key=$(python ci/scripts/toolchain.py --toolchain "${TOOLCHAIN}" --cache-dir "${TOOLCHAIN_CACHE}" --cache-key)" >> "${GITHUB_OUTPUT}"

      - name: Restore toolchains
        uses: actions/cache@v5
        with:
          path: toolchains
          key: ${{ runner.os }}-${{ steps.toolchain-key.outputs.key }}

      - name: Install toolchains
        id: toolchain
        timeout-minutes: 15
        env:
          TOOLCHAIN: ${{ toJSON(matrix.toolchain) }}
        run: |
          python ci/scripts/toolchain.py --toolchain "${TOOLCHAIN}" --cache-dir "${TOOLCHAIN_CACHE}" \
            --env-file "${GITHUB_ENV}" >> "${GITHUB_PATH}"

      - name: Install build tools
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check cmake ninja kconfiglib

      - name: Fetch workspace
        id: fetch
        timeout-minutes: 45
        env:
          MANIFEST: ${{ matrix.manifest }}
          FALLBACK: ${{ matrix.fallback_manifest }}
          DERIVE: ${{ matrix.derive_fallback }}
          DERIVE_PRIMARY: ${{ matrix.derive_primary }}
        run: |
          args=(--workspace "${WS}" --manifest "${MANIFEST}" --report-dir "${REPORT_DIR}/fetch")
          [ -n "${FALLBACK}" ] && args+=(--fallback "${FALLBACK}")
          [ "${DERIVE}" = "true" ] && args+=(--derive-fallback)
          [ "${DERIVE_PRIMARY}" = "true" ] && args+=(--derive-primary)
          python ci/scripts/fetch.py "${args[@]}"

      - name: Record verified revisions
        working-directory: ws
        run: west manifest --freeze > "${REPORT_DIR}/manifest-revisions.yml"

      # The requirements file comes with the fetched zephyr, as in the SDK README.
      - name: Install Zephyr Python dependencies
        if: matrix.builder == 'zephyr-west'
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check -r ws/zephyrproject/zephyr/scripts/requirements-base.txt
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "${GITHUB_ENV}"

      # Written before the build so a failed build still says what moved.
      - name: Report drift against locked manifest
        if: matrix.lock_manifest
        continue-on-error: true
        env:
          LOCK: ws/.manifest/${{ matrix.lock_manifest }}
          FLOATING: ws/.manifest/${{ matrix.manifest }}
        run: |
          python ws/.manifest/scripts/bump_lock.py \
            --lock "${LOCK}" \
            --candidate "${REPORT_DIR}/manifest-revisions.yml" \
            --floating "${FLOATING}" \
            --repos "${WS}" \
            --report "${REPORT_DIR}/drift.md"

      - name: Build
        id: build
        env:
          BUILDER: ${{ matrix.builder }}
          BUILD: ${{ toJSON(matrix.build) }}
          TOOLCHAIN: ${{ toJSON(matrix.toolchain) }}
          ARTIFACTS: ${{ toJSON(matrix.artifacts) }}
        run: |
          python "ci/scripts/adapters/${BUILDER//-/_}.py" \
            --workspace "${WS}" \
            --manifest-dir "${WS}/.manifest" \
            --build "${BUILD}" \
            --toolchain "${TOOLCHAIN}" \
            --artifacts "${ARTIFACTS}" \
            --jobs "$(nproc)" \
            --report-dir "${REPORT_DIR}/build"

      # A fallback build must not become the lock; a manifest branch other than
      # master cannot be promoted, and push runs test CI changes.
      - name: Package lock promotion
        id: promotion
        if: >-
          matrix.lock_manifest && steps.build.outcome == 'success' && env.USED_FALLBACK != 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && (inputs.manifest_ref || 'master') == 'master'
        env:
          LOCK: ${{ matrix.lock_manifest }}
          # promote_lock.py expects the lock's own floating manifest, not the one fetched.
          FLOATING: ${{ matrix.lock_source }}
          FETCHED: ${{ matrix.manifest }}
          MANIFEST_COMMIT: ${{ needs.plan.outputs.manifest_commit }}
        run: |
          args=()
          [ "${FLOATING}" != "${FETCHED}" ] && args+=(--rehost-candidate)
          python ci/scripts/promotion.py \
            --manifest-dir ws/.manifest \
            --lock "${LOCK}" \
            --floating "${FLOATING}" \
            --candidate "${REPORT_DIR}/manifest-revisions.yml" \
            --repos "${WS}" \
            --manifest-repository realmcu/HMI-MANIFEST \
            --manifest-commit "${MANIFEST_COMMIT}" \
            --out promotion \
            "${args[@]}"

      - name: Upload lock promotion
        if: steps.promotion.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lock-promotion-${{ matrix.id }}-${{ github.run_id }}
          path: promotion/
          if-no-files-found: error
          retention-days: 90

      - name: Announce promotion candidate
        if: steps.promotion.outcome == 'success'
        run: |
          {
            echo "### Lock promotion candidate"
            echo
            echo "Artifact \`lock-promotion-${{ matrix.id }}-${GITHUB_RUN_ID}\` holds the lock this run verified."
            echo "Promote it from a manifest checkout at gerrit/master:"
            echo
            echo '```'
            echo "python scripts/promote_lock.py prepare"
            echo "python scripts/promote_lock.py submit"
            echo '```'
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      # SPEC 5.3: the first failing stage decides the result.
      - name: Classify result
        if: always()
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TARGET_ID: ${{ matrix.id }}
          TIER: ${{ matrix.tier }}
          TRACK: ${{ matrix.track }}
          MANIFEST: ${{ matrix.manifest }}
          MANIFEST_COMMIT: ${{ needs.plan.outputs.manifest_commit }}
        run: |
          build_result="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("result",""))' "${REPORT_DIR}/build/summary.json" 2>/dev/null || true)"
          with_workarounds="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("with_workarounds", False)).lower())' "${REPORT_DIR}/build/summary.json" 2>/dev/null || echo false)"
          if [ "${TOOLCHAIN_OUTCOME}" != "success" ]; then
            status=INFRA_FAIL
          elif [ "${FETCH_OUTCOME}" != "success" ]; then
            status="${FETCH_STATUS:-INFRA_FAIL}"
          elif [ "${BUILD_OUTCOME}" = "success" ]; then
            status=PASS
          elif [ "${build_result}" = "FAIL" ]; then
            status=BUILD_FAIL
          else
            status=INFRA_FAIL
          fi
          mkdir -p "${REPORT_DIR}"
          python - "${status}" "${with_workarounds}" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = Path(os.environ["REPORT_DIR"])
          result = {
              "id": os.environ["TARGET_ID"],
              "tier": os.environ["TIER"],
              "track": os.environ["TRACK"],
              "manifest": os.environ.get("FETCHED_MANIFEST") or os.environ["MANIFEST"],
              "used_fallback": os.environ.get("USED_FALLBACK") == "true",
              "status": sys.argv[1],
              # A PASS that needed a temporary workaround (HMI-CI decisions D11, D12).
              "with_workarounds": sys.argv[1] == "PASS" and sys.argv[2] == "true",
              "ci_commit": os.environ["GITHUB_SHA"],
              "manifest_commit": os.environ["MANIFEST_COMMIT"],
          }
          (report / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
          echo "::notice::${TARGET_ID} (${TRACK}): ${status}"
          {
            echo "## \`${TARGET_ID}\` (${TRACK}): ${status}"
            echo
            echo "Manifest: \`${FETCHED_MANIFEST:-${MANIFEST}}\`"
            if [ "${USED_FALLBACK}" = "true" ]; then
              echo
              echo "_Fetched from the fallback manifest after a network failure; no lock promotion is produced from this run._"
            fi
            echo
            [ -f "${REPORT_DIR}/build/summary.md" ] && cat "${REPORT_DIR}/build/summary.md"
            if [ -f "${REPORT_DIR}/drift.md" ]; then
              echo
              echo "<details><summary>Drift against locked manifest</summary>"
              echo
              cat "${REPORT_DIR}/drift.md"
              echo
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.id }}-${{ matrix.track }}-${{ github.run_id }}
          path: report/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, build]
    # Runs when builds fail or are skipped too; a missing job result is itself a finding.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    # Mail retries can take 7.5 minutes per message.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v7

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download plan and job reports
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Find previous run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(python scripts/previous_run.py \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow hmi-ci.yml \
            --current-run "${GITHUB_RUN_ID}" \
            --dest previous)"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Aggregate
        id: aggregate
        env:
          PREVIOUS_RUN: ${{ steps.previous.outputs.run_id }}
        run: |
          mkdir -p results
          args=(--plan "artifacts/plan-${GITHUB_RUN_ID}/plan.json"
                --reports artifacts
                --run-id "${GITHUB_RUN_ID}"
                --output results/results.json
                --summary "${GITHUB_STEP_SUMMARY}")
          if [ -n "${PREVIOUS_RUN}" ]; then
            args+=(--previous previous/results.json --previous-run-id "${PREVIOUS_RUN}")
          fi
          python scripts/aggregate.py "${args[@]}"

      # Only recorded runs feed the next comparison; push runs are CI self-tests.
      - name: Upload results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ github.run_id }}
          path: results/results.json
          if-no-files-found: error
          retention-days: 90

      # SMTP secrets reach only recorded runs; pull requests and pushes never mail.
      - name: Mail
        if: steps.aggregate.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_TO: ${{ inputs.notify_to }}
        run: |
          python scripts/notify.py run \
            --results results/results.json \
            --reports artifacts \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --undelivered undelivered.md \
            ${NOTIFY_TO:+--to "${NOTIFY_TO}"}

      # GitHub mails the repository's watchers about the issue without going through SMTP.
      - name: Report undelivered mail
        if: failure() && hashFiles('undelivered.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report_undelivered.sh undelivered.md
