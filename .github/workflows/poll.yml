name: Poll manifest repository

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

# Writes only to this repository: state.json on the state branch, and a
# dispatch of hmi-ci.yml. Never pushes to a product repository.
permissions:
  contents: write
  actions: write

concurrency:
  group: poll-manifest
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v7
        with:
          path: ci

      - name: Checkout manifest repository
        uses: actions/checkout@v7
        with:
          repository: realmcu/HMI-MANIFEST
          ref: master
          path: manifest
          # Enough history to diff against the head recorded at the last poll.
          fetch-depth: 200

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt

      # A separate worktree reuses the credentials actions/checkout set up for ci/.
      - name: Checkout state branch
        run: |
          if git -C ci fetch --depth 1 origin state; then
            git -C ci worktree add "${GITHUB_WORKSPACE}/state" FETCH_HEAD --detach
          else
            git -C ci worktree add --orphan -b state "${GITHUB_WORKSPACE}/state"
          fi

      - name: Poll
        id: poll
        run: |
          python ci/scripts/poll.py \
            --state state/state.json \
            --manifest-root manifest \
            --targets ci/targets.yml \
            --github-output "${GITHUB_OUTPUT}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Dispatch verification
        if: steps.poll.outputs.targets != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.poll.outputs.head }}
          TARGETS: ${{ steps.poll.outputs.targets }}
        run: |
          gh workflow run hmi-ci.yml -R "${GITHUB_REPOSITORY}" --ref main \
            -f manifest_ref="${HEAD}" -f targets="${TARGETS}"

      - name: Commit state
        if: steps.poll.outputs.commit == 'true'
        working-directory: state
        env:
          HEAD: ${{ steps.poll.outputs.head }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "state: manifest ${HEAD:0:12}" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:refs/heads/state
