# SDK targets verified by this CI. Manifest paths are relative to the root of
# realmcu/HMI-MANIFEST. Field reference: README.md.
schema_version: 1

# Mail recipients. Each target's `owners` are added for that target only.
notify:
  ci_maintainers: [luke_sun@realsil.com.cn]
  watchers: [howie_wang@realsil.com.cn]
  weekly:
    - shel_deng@realsil.com.cn
    - astor_zhang@realsil.com.cn
    - howie_wang@realsil.com.cn
    - luke_sun@realsil.com.cn
    - roy_xie@realsil.com.cn
    - sienna_shen@realsil.com.cn
    - triton_yu@realsil.com.cn
    - wenjing_jiang@realsil.com.cn

targets:
  # Fetched from github only. Lock checks are paused while the manifest pins every
  # project: to resume, add back lock_manifest: dashboard/rtl8773e-dashboard-gitee.lock.yml
  # and version_model: floating once the manifest follows branches again.
  - id: rtl8773e-dashboard
    tier: customer
    manifest: dashboard/rtl8773e-dashboard-github.yml
    mirror_manifest: dashboard/rtl8773e-dashboard-gitee.yml
    version_model: pinned
    builder: hmi-west
    build:
      profile: full
    toolchain:
      # Version recommended by the SDK's gcc/README.md.
      arm-gnu: 12.3.rel1
    triggers: [nightly, on-change]
    timeout: 60
    owners: [astor_zhang@realsil.com.cn]

  # x3G SDKs pull the zsdk and zephyr from github even through their gitee manifest,
  # so the github manifest is primary and has nothing to fall back to.
  - id: rtl8773g-dashboard
    tier: preview
    manifest: dashboard/rtl8773g-dashboard-github.yml
    mirror_manifest: dashboard/rtl8773g-dashboard-gitee.yml
    version_model: pinned
    builder: zephyr-west
    build:
      workarounds: [d12-restore-exec-bits]
      products:
        - {name: dashboard, app: applications/dashboard, board: rtl87x3g_evb}
        - name: sample-honeygui
          app: samples/honeygui
          board: rtl87x3g_sample
          workarounds: [d11-skip-version-generation]
    toolchain:
      # SDK_VERSION of the zephyr revision the zsdk pins.
      zephyr-sdk: 0.16.9
    triggers: [nightly, on-change]
    timeout: 45
    owners: [astor_zhang@realsil.com.cn]

  - id: rtl8773g-chargebox
    tier: preview
    manifest: chargebox/rtl8773g-chargebox-github.yml
    mirror_manifest: chargebox/rtl8773g-chargebox-gitee.yml
    version_model: mixed
    builder: zephyr-west
    build:
      workarounds: [d12-restore-exec-bits]
      products:
        - {name: chargebox, app: applications/chargebox, board: rtl87x3g_evb}
        - name: sample-honeygui
          app: samples/honeygui
          board: rtl87x3g_sample
          workarounds: [d11-skip-version-generation]
        - name: sample-lvgl
          app: samples/lvgl
          board: rtl87x3g_sample
          workarounds: [d11-skip-version-generation]
    toolchain:
      zephyr-sdk: 0.16.9
    triggers: [nightly, on-change]
    timeout: 45
    owners: [luke_sun@realsil.com.cn]
